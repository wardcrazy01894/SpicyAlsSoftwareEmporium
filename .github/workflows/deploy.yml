name: deploy

# Publish site/ to GitHub Pages on every push to main (i.e. after a PR merges).
# There is no build step: the folder is uploaded as-is. A custom domain is
# switched on by adding site/CNAME — see docs/OPERATIONS.md §Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploys from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: package site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      # Deploy gate: merges to main are CI-gated by branch protection, but a
      # workflow_dispatch re-deploy is not. Cheap insurance.
      - name: Test gate (tests + lint + format)
        run: |
          npm test
          npm run lint
          npm run format:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
